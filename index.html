<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 1</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-VReO-5LHUi7VwTx3gjNKGEDSImYckmr9crhBDbwy7Q&s=10" type="image/x-icon">
</head>
<body>
    <header>
        <h1>Registration Project</h1>
    </header>

    <main>
        <section>
            <h2>Cadastro</h2>
            <form id="formCadastro" method="POST">
                <p>
                    <label for="nome">Nome completo: </label>
                    <input type="text" id="nome" name="nome" required />
                </p>

                <p>
                    <label for="email">Informe seu e-mail: </label>
                    <input type="email" id="email" name="email" required />
                </p>

                <p>
                    <label for="senha">Informe sua senha: </label>
                    <input type="password" id="senha" name="senha" required minlength="8" maxlength="12" 
                        pattern="(?=.*\d).{8,}" title="Mínimo de 8 caracteres, e máximo 12, com pelo menos um número.">
                </p>

                <p>
                    <label>
                        <input type="checkbox" id="termos" name="termos" required />
                        Concordo com os termos de uso
                    </label>
                </p>

                <p>
                    <input type="submit" id="btnEnviar" value="Cadastrar">
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Registration Project. Todos os direitos reservados.</p>
    </footer>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Dados enviados');
        })
    </script>
</body>
</html>
